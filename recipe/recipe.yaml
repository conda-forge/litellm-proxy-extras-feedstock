schema_version: 1

context:
  version: "0.4.91"

package:
  name: litellm-proxy-extras
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/litellm-proxy-extras/litellm_proxy_extras-${{ version }}.tar.gz
  sha256: 5cac5f06f9addd023b5c99a05c2c4c5147eaf799d8f00567e3ee8f04e4595c0b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - uv-build >=0.11.8,<0.13
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - litellm_proxy_extras
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - python -c "from litellm_proxy_extras.utils import ProxyExtrasDBManager"
      - python -c "import os, litellm_proxy_extras; assert os.path.isdir(os.path.join(os.path.dirname(litellm_proxy_extras.__file__), 'migrations'))"
      - python -c "import os, litellm_proxy_extras; assert os.path.isfile(os.path.join(os.path.dirname(litellm_proxy_extras.__file__), 'schema.prisma'))"

about:
  homepage: https://litellm.ai
  summary: Additional files for the LiteLLM Proxy
  description: |
    Additional files for the LiteLLM Proxy. Reduces the size of the main
    litellm package by storing the Prisma schema and database migration
    files for litellm-proxy separately.
  license: MIT
  license_file: LICENSE
  documentation: https://docs.litellm.ai
  repository: https://github.com/BerriAI/litellm

extra:
  recipe-maintainers:
    - pb01ka
